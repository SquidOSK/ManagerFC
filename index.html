<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Manager FC</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:#eef2ff}button{border:0;border-radius:12px;padding:12px 16px;background:#2563eb;color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.12)}
.app{display:flex;min-height:100vh}.side{width:230px;background:#101827;padding:20px;position:fixed;top:0;bottom:0}.logo{font-size:24px;font-weight:800;margin-bottom:25px}.nav button{display:block;width:100%;text-align:left;margin:7px 0;background:#182338}.nav button.active{background:#2563eb}.main{margin-left:230px;padding:25px;width:calc(100% - 230px)}
.hero{background:linear-gradient(135deg,#172554,#101827);padding:25px;border-radius:20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}.hero h1{margin:0;font-size:32px}.money{font-size:24px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card,.panel{background:#111b2d;border:1px solid #263247;border-radius:16px;padding:18px}.panel{margin-top:18px}.label{color:#94a3b8;font-size:12px}.value{font-size:22px;font-weight:800;margin-top:6px}
.row{display:grid;grid-template-columns:2fr 1fr .7fr 1.3fr 1.2fr;gap:12px;padding:12px;border-bottom:1px solid #263247;align-items:center}.header{color:#94a3b8;font-size:12px;font-weight:700}.progress{height:7px;background:#263247;border-radius:8px;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:#22c55e}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #263247}th{color:#94a3b8}.news{padding:11px 0;border-bottom:1px solid #263247}
@media(max-width:800px){.app{display:block}.side{position:static;width:100%;height:auto}.main{margin:0;width:100%;padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.hero{display:block}.money{margin-top:12px}.row{grid-template-columns:1.7fr 1fr .7fr}.row>:nth-child(4),.row>:nth-child(5){display:none}}
</style></head><body><div class="app"><aside class="side"><div class="logo">⚽ Manager FC</div><div class="nav" id="nav"></div><button id="reset" style="width:100%;margin-top:18px;background:#263247">🔄 Novo jogo</button></aside><main class="main"><div id="app"></div></main></div>
<script>
const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const adv=["Flamengo","Palmeiras","São Paulo","Corinthians","Santos","Vasco","Fluminense","Botafogo","Grêmio","Internacional","Cruzeiro","Atlético-MG","Bahia","Fortaleza","Athletico-PR","Bragantino","Ceará","Sport","Juventude","Mirassol"];
const mercado=[
["Lucas Andrade","Atacante",82,28000000,1800000],["Matheus Oliveira","Meia",78,18000000,1200000],["Rafael Santos","Zagueiro",75,12000000,900000],["João Victor","Goleiro",80,22000000,1500000],["Gabriel Rocha","Volante",73,9000000,700000],["Pedro Henrique","Ponta",85,35000000,2300000],["Caio Martins","Lateral",77,15000000,950000],["Bruno Costa","Atacante",88,42000000,2800000],["André Lima","Zagueiro",81,25000000,1600000],["Felipe Alves","Meia",86,38000000,2400000]];
const iniciais=[
["Carlos Mendes","Goleiro",74,8000000,600000],["Marcos Silva","Goleiro",71,6000000,500000],["Lucas Pereira","Lateral",73,7000000,550000],["Diego Alves","Lateral",70,5000000,450000],["Renato Souza","Lateral",75,9000000,650000],["Felipe Santos","Lateral",72,6500000,500000],["Rafael Oliveira","Zagueiro",76,11000000,700000],["Bruno Martins","Zagueiro",73,8000000,600000],["Thiago Costa","Zagueiro",78,13000000,800000],["André Souza","Zagueiro",70,5500000,450000],["Gabriel Lima","Volante",75,10000000,650000],["Pedro Souza","Volante",72,7000000,550000],["Lucas Ferreira","Meia",79,16000000,950000],["Henrique Oliveira","Meia",76,12000000,750000],["Daniel Martins","Meia",74,9000000,650000],["Eduardo Costa","Meia",71,6000000,500000],["João Pedro","Ponta",77,14000000,850000],["Gustavo Henrique","Ponta",74,10000000,700000],["Vinícius Rocha","Ponta",72,8000000,600000],["Mateus Ribeiro","Atacante",80,20000000,1000000],["Rodrigo Alves","Atacante",76,13000000,800000],["Caio Henrique","Atacante",73,9000000,650000]];
const O=x=>({nome:x[0],pos:x[1],nivel:x[2],valor:x[3],salario:x[4]});
const dinheiro=n=>(n<0?"-":"")+"R$ "+Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2});
const clamp=n=>Math.max(0,Math.min(100,n));
function novo(){return{mes:1,saldo:80000000,folha:15000000,moral:65,desempenho:60,torcida:60,reputacao:50,v:0,e:0,d:0,sg:0,elenco:iniciais.map(O),historico:[],noticias:["📣 A temporada começou! A torcida espera uma grande campanha."]}};
let S=JSON.parse(localStorage.getItem("managerFC"))||novo(), pagina="home";
function save(){localStorage.setItem("managerFC",JSON.stringify(S))}
function tabela(){let t={};["Manager FC",...adv].forEach(c=>t[c]={p:0,j:0,v:0,e:0,d:0,sg:0});t["Manager FC"]={p:S.v*3+S.e,j:S.v+S.e+S.d,v:S.v,e:S.e,d:S.d,sg:S.sg};adv.forEach(c=>{let x=t[c];while(x.j<t["Manager FC"].j){let r=Math.random();x.j++;if(r<.35){x.v++;x.p+=3;x.sg+=Math.floor(Math.random()*4)}else if(r<.65){x.e++;x.p++}else{x.d++;x.sg-=Math.floor(Math.random()*4)}}});return Object.entries(t).sort((a,b)=>b[1].p-a[1].p||b[1].sg-a[1].sg||b[1].v-a[1].v)}
function pos(){return tabela().findIndex(x=>x[0]=="Manager FC")+1}
function header(){return`<div class="hero"><div><h1>⚽ Manager FC</h1><div>${meses[S.mes-1]} • Temporada</div></div><div class="money">${dinheiro(S.saldo)}</div></div>`}
function metricas(){return`<div class="grid"><div class="card"><div class="label">🏆 POSIÇÃO</div><div class="value">${pos()}º</div></div><div class="card"><div class="label">💰 SALDO</div><div class="value">${dinheiro(S.saldo)}</div></div><div class="card"><div class="label">💪 MORAL</div><div class="value">${S.moral}/100</div></div><div class="card"><div class="label">📈 DESEMPENHO</div><div class="value">${S.desempenho}/100</div></div><div class="card"><div class="label">👥 ELENCO</div><div class="value">${S.elenco.length}</div></div></div>`}
function home(){return header()+metricas()+`<div class="panel"><h2>📅 ${meses[S.mes-1]}</h2><p><b>${S.v}V</b> • <b>${S.e}E</b> • <b>${S.d}D</b> • SG <b>${S.sg>=0?"+":""}${S.sg}</b></p><button onclick="partida()">⚽ Jogar partida</button> <button onclick="mes()" style="background:#334155">📅 Encerrar mês</button></div><div class="panel"><h2>📰 Notícias</h2>${S.noticias.slice(0,7).map(n=>`<div class="news">${n}</div>`).join("")}</div>`}
function elenco(){return header()+`<div class="panel"><h2>👥 Elenco — ${S.elenco.length} jogadores</h2><div class="row header"><div>JOGADOR</div><div>POSIÇÃO</div><div>NÍVEL</div><div>VALOR</div><div>SALÁRIO</div></div>${S.elenco.map(j=>`<div class="row"><div><b>${j.nome}</b><div class="progress"><span style="width:${j.nivel}%"></span></div></div><div>${j.pos}</div><div><b>${j.nivel}</b></div><div>${dinheiro(j.valor)}</div><div>${dinheiro(j.salario)}</div></div>`).join("")}</div>`}
function mercadoPage(){let nomes=S.elenco.map(j=>j.nome);let m=mercado.filter(x=>!nomes.includes(x[0]));return header()+`<div class="panel"><h2>🔄 Mercado de transferências</h2><p>${[1,2,7,8,9].includes(S.mes)?"🟢 Janela aberta":"🔴 Janela fechada"}</p>${m.map(x=>`<div class="row"><div><b>${x[0]}</b></div><div>${x[1]}</div><div>${x[2]}</div><div>${dinheiro(x[3])}</div><div><button onclick="contratar('${x[0]}')">Contratar</button></div></div>`).join("")}</div>`}
function tabelaPage(){return header()+`<div class="panel"><h2>🏆 Brasileirão</h2><table><tr><th>POS</th><th>CLUBE</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr>${tabela().map((r,i)=>`<tr style="${r[0]=="Manager FC"?"background:#172554;font-weight:bold":""}"><td>${i+1}º</td><td>${r[0]}</td><td>${r[1].p}</td><td>${r[1].j}</td><td>${r[1].v}</td><td>${r[1].e}</td><td>${r[1].d}</td><td>${r[1].sg>=0?"+":""}${r[1].sg}</td></tr>`).join("")}</table></div>`}
function fin(){let valor=S.elenco.reduce((a,j)=>a+j.valor,0);return header()+metricas()+`<div class="panel"><h2>💰 Finanças</h2><p>Folha salarial: <b>${dinheiro(S.folha)}</b></p><p>Valor do elenco: <b>${dinheiro(valor)}</b></p><table><tr><th>MÊS</th><th>RECEITA</th><th>FOLHA</th><th>SALDO</th></tr>${S.historico.map(x=>`<tr><td>${x.m}</td><td>${dinheiro(x.r)}</td><td>${dinheiro(x.f)}</td><td>${dinheiro(x.s)}</td></tr>`).join("")}</table></div>`}
const eventos=[["NOVO PATROCINADOR",[["Aceitar contrato",12000000,2],["Exigir valor maior",20000000,4],["Recusar",-2000000,-2],["Contrato com bônus",7000000,3],["Leiloar camisa",28000000,-3]]],["CATEGORIAS DE BASE",[["Investir R$ 10 milhões",-10000000,6],["Investir R$ 5 milhões",-5000000,2],["Investir R$ 1 milhão",-1000000,0],["Não investir",3000000,-5],["Vender jovem",15000000,-4]]],["REFORMA DO ESTÁDIO",[["Reforma completa",-35000000,10],["Reformar vestiários",-8000000,2],["Setores populares",-12000000,0],["Adiar reforma",2000000,-3],["Construir camarotes",18000000,3]]],["DÍVIDA INESPERADA",[["Pagar toda",-20000000,8],["Parcelar",-5000000,2],["Contestar",3000000,-5],["Empréstimo",15000000,-2],["Vender direitos",25000000,-3]]]];
function decisoes(){let e=eventos[Math.floor(Math.random()*eventos.length)];window.eventoAtual=e;return header()+`<div class="panel"><h2>📰 ${e[0]}</h2><p>Escolha uma decisão para o clube.</p>${e[1].map((x,i)=>`<button style="display:block;width:100%;margin:9px 0;text-align:left" onclick="decidir(${i})">${i+1}. ${x[0]}</button>`).join("")}</div>`}
function decidir(i){let x=window.eventoAtual[1][i];S.saldo+=x[1];S.reputacao=clamp(S.reputacao+x[2]);S.noticias.unshift("📰 Decisão tomada: "+x[0]);save();render()}
function moral(){let a=[["Oferecer bônus",-6000000,15,3],["Organizar jantar",-800000,8,0],["Cobrar dedicação",0,-5,8],["Dar folga",0,10,-4],["Prometer prêmio",-10000000,12,4]];return header()+`<div class="panel"><h2>💪 Gestão do elenco</h2>${a.map((x,i)=>`<button style="display:block;width:100%;margin:9px 0;text-align:left" onclick="moralAct(${i})">${x[0]}</button>`).join("")}</div>`}
function moralAct(i){let x=[["Oferecer bônus",-6000000,15,3],["Organizar jantar",-800000,8,0],["Cobrar dedicação",0,-5,8],["Dar folga",0,10,-4],["Prometer prêmio",-10000000,12,4]][i];S.saldo+=x[1];S.moral=clamp(S.moral+x[2]);S.desempenho=clamp(S.desempenho+x[3]);S.noticias.unshift("💪 "+x[0]);save();render()}
function partida(){let o=adv[Math.floor(Math.random()*adv.length)],fm=S.desempenho+S.moral*.4+(Math.random()*40-20),fo=45+Math.random()*50,gm,ga,msg;if(fm>fo+12){gm=2+Math.floor(Math.random()*3);ga=Math.floor(Math.random()*2);S.v++;S.saldo+=2000000;S.moral=clamp(S.moral+5);S.desempenho=clamp(S.desempenho+2);msg=`🏆 Vitória: Manager FC ${gm} x ${ga} ${o}`}else if(fm>=fo-8){gm=Math.floor(Math.random()*3);ga=gm;S.e++;S.saldo+=800000;S.moral=clamp(S.moral+1);msg=`🤝 Empate: Manager FC ${gm} x ${ga} ${o}`}else{gm=Math.floor(Math.random()*2);ga=2+Math.floor(Math.random()*3);S.d++;S.moral=clamp(S.moral-6);S.desempenho=clamp(S.desempenho-2);msg=`❌ Derrota: Manager FC ${gm} x ${ga} ${o}`}S.sg+=gm-ga;S.noticias.unshift(msg);save();render()}
function mes(){let r=4000000+S.torcida*100000+S.reputacao*50000;S.saldo-=S.folha;S.saldo+=r;S.historico.push({m:meses[S.mes-1],r:r,f:S.folha,s:S.saldo});if(S.mes<12)S.mes++;else S.final=true;S.noticias.unshift(S.mes<12?"📅 Começou "+meses[S.mes-1]:"🏆 Fim da temporada!");save();render()}
function contratar(nome){if(![1,2,7,8,9].includes(S.mes)){alert("A janela está fechada.");return}let x=mercado.find(j=>j[0]==nome);if(S.saldo<x[3]){alert("Saldo insuficiente.");return}S.saldo-=x[3];S.folha+=x[4];S.elenco.push(O(x));S.desempenho=clamp(S.desempenho+Math.max(1,Math.floor((x[2]-70)/2)));S.torcida=clamp(S.torcida+3);S.reputacao=clamp(S.reputacao+2);S.noticias.unshift("🔄 "+nome+" foi contratado.");save();render()}
function go(p){pagina=p;render()}function nav(){let a=[["home","📊 Visão geral"],["squad","👥 Elenco"],["market","🔄 Mercado"],["table","🏆 Brasileirão"],["fin","💰 Finanças"],["dec","📰 Decisões"],["moral","💪 Moral"]];document.getElementById("nav").innerHTML=a.map(x=>`<button class="${pagina==x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
function render(){nav();document.getElementById("app").innerHTML=pagina=="home"?home():pagina=="squad"?elenco():pagina=="market"?mercadoPage():pagina=="table"?tabelaPage():pagina=="fin"?fin():pagina=="dec"?decisoes():moral()}
document.getElementById("reset").onclick=()=>{if(confirm("Começar uma nova temporada?")){S=novo();save();render()}};if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");render();
</script></body></html>
